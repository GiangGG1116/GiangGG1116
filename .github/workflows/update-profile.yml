name: Regenerate Profile SVG Cards

on:
  push:
    branches:
      - main
    paths:
      - "data/profile.json"
      - "scripts/generate_profile.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Light & Dark SVG assets
        run: python3 scripts/generate_profile.py

      - name: Commit updated SVG assets if changed
        run: |
          if [ -n "$(git status --porcelain assets/svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/svg
            git commit -m "chore: regenerate profile SVG cards"
            git push
          fi

